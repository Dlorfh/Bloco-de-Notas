<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos gerais para a página */
body {
    font-family: sans-serif;
    background-color: blue;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* O contêiner principal que centraliza nosso conteúdo */
.container {
    background-color: rgb(0, 0, 0);
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 90%;
    max-width: 600px;
}

h1 {
    color: blue;
}

p {
    color: #6c757d;
    margin-bottom: 20px;
}

/* Estilizando nossa área de texto (textarea) */
#blocoDeNotas {
    width: 100%;
    height: 200px;
    padding: 15px;
    border: 1px solid #ced4da;
    border-radius: 4px;
    font-size: 16px;
    line-height: 1.5;
    box-sizing: border-box; /* Garante que o padding não aumente a largura total */
    resize: vertical; /* Permite que o usuário redimensione a altura */
}

#blocoDeNotas:focus {
    outline: none;
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
}
    </style>
</head>
<body>

    <div class="container">
        <h1>Bloco Storage</h1>
        <p>Seus pensamentos são salvos automaticamente no seu navegador.</p>

        
        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..."></textarea>
    </div>

    <script src="script.js">
        document.addEventListener('DOMContentLoaded', () => {
    
    const blocoDeNotas = document.getElementById('blocoDeNotas');
    const notaSalva = localStorage.getItem('minhaNota');
    if (notaSalva) {
        blocoDeNotas.value = notaSalva;
    }

    blocoDeNotas.addEventListener('input', () => {
        localStorage.setItem('minhaNota', blocoDeNotas.value);
        console.log("Nota salva no localStorage!"); 
    });

});
    </script>
</body>
</html>
